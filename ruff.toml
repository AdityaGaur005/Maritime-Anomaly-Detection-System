[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort
select = ["E", "W", "F", "I"]
ignore = [
    "E501",  # line too long — handled by formatter, not linter
    "F401",  # unused imports in __init__.py files
]

[tool.ruff.lint.per-file-ignores]
# Training scripts use * imports and broad patterns
"hybrid/*.py" = ["F841", "E402"]
"model/*.py"  = ["F841", "E402"]
"processing/*.py" = ["F841"]
# Test files can use assert without message
"tests/*.py" = ["S101"]
